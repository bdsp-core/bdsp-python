[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bdsp"
version = "0.2.0"
description = "Python readers for BDSP/Sleep YODA HDF5 and split BIDS/TS-Zarr data."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "BDSP Core" }
]
keywords = ["bdsp", "hdf5", "eeg", "psg", "sleep", "neurophysiology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "h5py>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
zarr = [
  "zarr>=3.1,<4; python_version >= '3.11'",
]
test = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://bdsp.io/"
Documentation = "https://github.com/bdsp-core/bdsp-python/blob/main/docs/README.md"
Repository = "https://github.com/bdsp-core/bdsp-python"
Issues = "https://github.com/bdsp-core/bdsp-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bdsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
