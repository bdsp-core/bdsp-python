name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/bdsp-smoke
          /tmp/bdsp-smoke/bin/python -m pip install dist/*.whl
          /tmp/bdsp-smoke/bin/python -c "import bdsp; print(bdsp.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
